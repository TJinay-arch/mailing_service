{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}

{% block content %}

<style>
    .fade-in {
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .password-match {
        font-size: 14px;
        margin-top:8px;
    }
</style>

<div class="container d-flex justify-content-center mt-5 fade-in">

    <div class="card shadow-lg p-4" style="max-width:420px;width:100%;">

        <div class="text-center mb-3">
            <h3>🔒 Новый пароль</h3>
            <p class="text-muted">
                Введите новый пароль
            </p>
        </div>

        {% if validlink %}

        <form method="post">
            {% csrf_token %}

            <!-- PASSWORD 1 -->
            <div class="mb-3">

                <label class="form-label">Новый пароль</label>

                <div class="input-group">

                    {{ form.new_password1 }}

                    <button class="btn btn-outline-secondary toggle-password" type="button">
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <!-- Индикатор сложности -->
                <div class="progress mt-2" style="height:6px;">
                    <div id="passwordStrength" class="progress-bar"></div>
                </div>

            </div>

            <!-- PASSWORD 2 -->
            <div class="mb-2">

                <label class="form-label">Подтвердите пароль</label>

                <div class="input-group">

                    {{ form.new_password2 }}

                    <button class="btn btn-outline-secondary toggle-password" type="button">
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <!-- Совпадение -->
                <div id="passwordMatch" class="password-match mt-2"></div>

            </div>

            <button class="btn btn-primary w-100 mt-3">
                Сохранить пароль
            </button>

        </form>

        {% else %}

        <div class="alert alert-danger text-center">
            ❌ Ссылка недействительна
        </div>

        {% endif %}

    </div>

</div>

<script>

    document.addEventListener("DOMContentLoaded", function(){

    /* -------------------------
        👁 ПОКАЗАТЬ ПАРОЛЬ
    --------------------------*/

    document.querySelectorAll(".toggle-password").forEach(button => {

        button.addEventListener("click", function(){

            const input = this.parentElement.querySelector("input");
            const icon = this.querySelector("i");

            if(input.type === "password"){

                input.type = "text";
                icon.classList.remove("bi-eye");
                icon.classList.add("bi-eye-slash");

            } else {

                input.type = "password";
                icon.classList.remove("bi-eye-slash");
                icon.classList.add("bi-eye");

            }

        });

    });


    /* -------------------------
        🔒 СИЛА ПАРОЛЯ
    --------------------------*/

    const passwordInput = document.getElementById("id_new_password1");
    const confirmInput = document.getElementById("id_new_password2");

    const bar = document.getElementById("passwordStrength");

    if(passwordInput){

    passwordInput.addEventListener("input", function(){

        const value = passwordInput.value;

        let strength = 0;

        if(value.length >= 8) strength++;
        if(/[A-Z]/.test(value)) strength++;
        if(/[0-9]/.test(value)) strength++;
        if(/[^A-Za-z0-9]/.test(value)) strength++;

        const percent = strength * 25;

        bar.style.width = percent + "%";

        if(percent <= 25){
            bar.className = "progress-bar bg-danger";
        }
        else if(percent <= 50){
            bar.className = "progress-bar bg-warning";
        }
        else if(percent <= 75){
            bar.className = "progress-bar bg-info";
        }
        else{
            bar.className = "progress-bar bg-success";
        }

    });

    }


    /* -------------------------
        ⚡ ПРОВЕРКА СОВПАДЕНИЯ
    --------------------------*/

    const matchText = document.getElementById("passwordMatch");

    function checkPasswords(){

        if(!passwordInput || !confirmInput) return;

        if(confirmInput.value === ""){

            matchText.textContent = "";
            return;

        }

        if(passwordInput.value === confirmInput.value){

            matchText.textContent = "✔ Пароли совпадают";
            matchText.className = "password-match text-success";

        }
        else{

            matchText.textContent = "✖ Пароли не совпадают";
            matchText.className = "password-match text-danger";

        }

    }

    if(passwordInput && confirmInput){

    passwordInput.addEventListener("input", checkPasswords);
    confirmInput.addEventListener("input", checkPasswords);

    }

    });
</script>

{% endblock %}
