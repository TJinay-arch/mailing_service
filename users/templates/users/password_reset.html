{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:80vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 fade-in-card">
                <div class="card-body p-5">

                    <h3 class="mb-4 text-center">Восстановление пароля</h3>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Введите ваш email</label>
                            {{ form.email }}
                        </div>

                        <button class="btn btn-primary w-100 rounded-3">
                            Отправить ссылку
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'users:login' %}">
                            Вернуться ко входу
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
