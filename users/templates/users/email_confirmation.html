<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background:#f4f6f9; padding:40px;">

<div style="max-width:600px; margin:auto; background:white; padding:30px; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.1);">

    <h2 style="color:#0d6efd;">Подтверждение регистрации</h2>

    <p>Здравствуйте, {{ user.username }}!</p>

    <p>Спасибо за регистрацию в сервисе рассылок.</p>

    <p>Для активации аккаунта нажмите кнопку ниже:</p>

    <div style="text-align:center; margin:30px 0;">
        <a href="{{ confirm_link }}"
           style="background:#0d6efd;
                  color:white;
                  padding:12px 25px;
                  text-decoration:none;
                  border-radius:8px;
                  font-weight:bold;">
            Подтвердить email
        </a>
    </div>

    <p style="font-size:14px; color:#6c757d;">
        Если вы не регистрировались — просто проигнорируйте это письмо.
    </p>

</div>

</body>
</html>
