{% extends "base.html" %}

{% block content %}
<div class="card shadow p-4">
    <h4>Удалить рассылку?</h4>
    <p>Рассылка #{{ object.id }}</p>

    <form method="post">
        {% csrf_token %}
        <a href="{% url 'mailings:detail' object.pk %}"
           class="btn btn-secondary">Отмена</a>
        <button type="submit"
                class="btn btn-danger">Удалить
        </button>
    </form>
</div>
{% endblock %}
