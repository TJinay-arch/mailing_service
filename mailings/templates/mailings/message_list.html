{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between mb-3">
    <h3>Сообщения</h3>
    <a href="{% url 'mailings:message_create' %}" class="btn btn-primary">
        ➕ Добавить сообщение
    </a>
</div>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Тема</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    {% for message in messages %}
    <tr>
        <td>{{ message.subject }}</td>
        <td>
            <a href="{% url 'mailings:message_update' message.pk %}" class="btn btn-sm btn-warning">
                ✏
            </a>
            <a href="{% url 'mailings:message_delete' message.pk %}" class="btn btn-sm btn-danger">
                🗑
            </a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
