{% extends "base.html" %}
{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h4 class="mb-3">
            {% if form.instance.pk %}
            Редактирование
            {% else %}
            Новый получатель
            {% endif %}
        </h4>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">ФИО</label>
                {{ form.full_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Комментарий</label>
                {{ form.comment }}
            </div>

            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="{% url 'clients:list' %}" class="btn btn-secondary">Отмена</a>

        </form>

    </div>
</div>

{% endblock %}
