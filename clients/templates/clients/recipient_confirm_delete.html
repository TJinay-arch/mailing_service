{% extends "base.html" %}
{% block title %}Удаление{% endblock %}

{% block content %}
<h2>Удаление получателя</h2>

<p>Вы уверены, что хотите удалить "{{ object.full_name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'clients:list' %}" class="btn btn-secondary">Отмена</a>
</form>

{% endblock %}
