{% extends "base.html" %}
{% block title %}Получатели{% endblock %}

{% block content %}
<h2>Получатели</h2>

<a href="{% url 'clients:create' %}" class="btn btn-primary mb-3">
    Добавить получателя
</a>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Email</th>
        <th>ФИО</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    {% for recipient in recipients %}
    <tr>
        <td>{{ recipient.email }}</td>
        <td>{{ recipient.full_name }}</td>
        <td>
            <a href="{% url 'clients:detail' recipient.pk %}" class="btn btn-sm btn-info">Просмотр</a>
            <a href="{% url 'clients:update' recipient.pk %}" class="btn btn-sm btn-warning">Редактировать</a>
            <a href="{% url 'clients:delete' recipient.pk %}" class="btn btn-sm btn-danger">Удалить</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">Нет получателей</td>
    </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
