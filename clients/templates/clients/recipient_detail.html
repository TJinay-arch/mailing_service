{% extends "base.html" %}
{% block title %}Детали получателя{% endblock %}

{% block content %}
<h2>{{ recipient.full_name }}</h2>

<p><strong>Email:</strong> {{ recipient.email }}</p>
<p><strong>Комментарий:</strong> {{ recipient.comment }}</p>

<a href="{% url 'clients:update' recipient.pk %}" class="btn btn-warning">Редактировать</a>
<a href="{% url 'clients:delete' recipient.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'clients:list' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
