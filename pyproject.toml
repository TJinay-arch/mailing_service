[tool.poetry]
name = "mailing"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
dotenv = "^0.9.9"
psycopg2 = "^2.9.11"
pillow = "^12.1.1"
ipython = "^9.10.0"
django = "^6.0.2"
redis = "^7.3.0"


[tool.poetry.group.lint.dependencies]
black = "^26.1.0"
isort = "^8.0.1"
mypy = "^1.19.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '\.git'
