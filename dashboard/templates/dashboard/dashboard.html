{% extends "base.html" %}
{% block title %}Главная{% endblock %}

{% block content %}

<h2 class="mb-4">📊 Статистика</h2>

<div class="row g-4">

    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center">
                <h5 class="card-title text-muted">Всего рассылок</h5>
                <h2 class="fw-bold">{{ total_mailings }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center">
                <h5 class="card-title text-muted">Активных рассылок</h5>
                <h2 class="fw-bold text-success">{{ active_mailings }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center">
                <h5 class="card-title text-muted">Получателей</h5>
                <h2 class="fw-bold text-primary">{{ total_recipients }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
